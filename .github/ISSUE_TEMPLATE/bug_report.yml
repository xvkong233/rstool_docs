name: '🐛 Bug 报告'
description: 反馈文档内容错误或站点功能异常
labels: ['bug: pending triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请确认你要反馈的问题类型：

        - **文档内容问题**：命令描述、参数表、交互流程或配图有误；
        - **站点功能问题**：导航、搜索、样式等异常。

        > [!NOTE]
        > `docs/commands/` 下的命令页面由数据管线自动生成，请勿针对这些页面直接
        > 提交 PR；内容纠错请通过本模板反馈，由维护者落入数据源。
  - type: textarea
    id: bug-description
    attributes:
      label: 问题描述
      description: 清楚描述遇到的问题。若你打算直接提交 PR 修复，也请在这里说明。
      placeholder: 发生了什么？哪里不对？
    validations:
      required: true
  - type: textarea
    id: page-or-command
    attributes:
      label: 相关页面 / 命令
      description: 出现问题的页面链接或命令名（注意大小写）。
      placeholder: 页面链接或命令名，如 rsAiRender
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何看到这个问题？例如：打开某页面 → 搜索某词 → 看到了什么。
      placeholder: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望表现
      description: 清楚描述你认为正确的内容或行为。
      placeholder: 期望表现
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description:
        文档内容问题请填写 Rhino 版本与 RsTool 版本；站点问题请填写操作系统与
        浏览器。不适用可留空。
      render: Text
      placeholder: Rhino 8 SRxx / RsTool v1.x / Windows 11 / Chrome 1xx
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 其他上下文或截图。截图可直接粘贴到输入框上传。
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: 提交前请确认以下事项
      options:
        - label: 我使用的是[最新版 RsTool 插件](https://www.rstoolarchi.com)（内容类反馈适用）。
          required: true
        - label: 我已阅读[文档站](https://docs.rstoolarchi.com)与
            [贡献指南](https://github.com/xvkong233/rstool_docs/blob/main/.github/contributing.md)。
          required: true
        - label: 我已搜索现有 Issue，确认没有重复反馈。
          required: true
